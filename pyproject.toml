[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "golden-fighter"
version = "0.1.0"
description = "Golden Fighter AI Retention Intelligence: a CrewAI Flow with a contract-enforced handoff between two crews."
requires-python = ">=3.10,<3.14"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
golden_fighter = ["crews/*/config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# CrewAI's own internals use deprecated attributes; our code does not.
filterwarnings = ["ignore::DeprecationWarning:crewai.*"]
